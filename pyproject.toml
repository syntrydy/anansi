[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anansi"
version = "0.1.0"
authors = [
  { name="SQUAD3 Wakanda" }
]
description = "AI-Powered Multimodal Education for African Classrooms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-anthropic",
    "langchain-ollama",
    "fastmcp",
    "streamlit",
    "pydantic>=2.0",
    "pydantic-settings",
    "replicate",
    "google-cloud-texttospeech",
    "langfuse",
    "guardrails-ai",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "mypy",
    "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["src/anansi"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_anthropic.*",
    "langchain_ollama.*",
    "fastmcp.*",
    "streamlit.*",
    "replicate.*",
    "google.cloud.*",
    "langfuse.*",
    "guardrails.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
